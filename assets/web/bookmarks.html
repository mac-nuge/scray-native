  <script>
    // ── Version resolution ────────────────────────────────────────────────
    // Three independent streams:
    //   web  — the VERSION file in this folder
    //   dipa — dev IPA version   (ipa-versions.json -> CFBundleShortVersionString)
    //   pipa — prd IPA version   (same source, production variant)
    // The IPA identity arrives as window.SCRAY_NATIVE, injected by Swift at
    // documentStart. It is absent in Picker and in a plain browser.

    async function resolveWebVersion() {
      try {
        const res = await fetch('VERSION');
        if (res.ok) {
          const text = (await res.text()).trim();
          if (text) return text;
        }
      } catch (err) {
        // Expected in the offline IPA: the page is loaded from a file:// URL
        // and WebKit refuses fetch() on the file scheme entirely.
      }
      if (typeof window.SCRAY_VERSION === 'string' && window.SCRAY_VERSION.trim()) {
        return window.SCRAY_VERSION.trim();
      }
      throw new Error('No VERSION file and no window.SCRAY_VERSION');
    }

    // "10.0 disguise overlay" -> { number: "10.0", description: "disguise overlay" }
    // "10.0-staging"          -> { number: "10.0", description: "staging" }
    function splitWebVersion(text) {
      const m = String(text).trim().match(/^v?([0-9][0-9.]*)\s*[-–—_:]?\s*(.*)$/);
      if (!m) return { number: String(text).trim(), description: '' };
      return { number: m[1], description: (m[2] || '').trim() };
    }

    // Picker / browser: "v10.0 disguise overlay"
    // Dev IPA:          "dipa b42 web 10.0 disguise overlay"
    // Prd IPA:          "pipa b42 web 10.0 disguise overlay"
    function composeVersionLabel(versionText) {
      const n = window.SCRAY_NATIVE;
      if (!n || !n.build) return `v${versionText}`;
      const { number, description } = splitWebVersion(versionText);
      const prefix = n.variant === 'dev' ? 'dipa' : 'pipa';
      return `${prefix} b${n.build} web ${number}${description ? ' ' + description : ''}`;
    }

    async function setAppVersionFromFile() {
      try {
        const versionText = await resolveWebVersion();
        const label = composeVersionLabel(versionText);
        // The <h1> is the app identity and is now owned by the markup, not by
        // this script — we only read it so the document title matches.
        const h1 = document.querySelector('h1');
        const appName = (h1 && h1.textContent.trim()) || 'Universal';
        if (window.SCRAY_NATIVE) {
          console.log('[Scray] versions', {
            ipa: `${window.SCRAY_NATIVE.variant} b${window.SCRAY_NATIVE.build}`,
            shortVersion: window.SCRAY_NATIVE.version,
            buildId: window.SCRAY_NATIVE.buildId,
            web: versionText
          });
        }
        document.title = `${appName} (${label})`;
        const headerLine = document.getElementById('appVersionLine');
        if (headerLine) headerLine.textContent = label;
        document.getElementById('appVersion').textContent = label;
        document.getElementById('lockOverlayVersion').textContent = label;
        const versionLower = versionText.toLowerCase();

        // Lock screen is always black now — environment colouring removed.
        const lockOverlayEl = document.getElementById('lockOverlay');
        if (lockOverlayEl) {
          lockOverlayEl.style.background = '#111';
        }
        if (versionLower.includes('staging') || versionLower.includes('uat')) {
          const banner = document.createElement('div');
          banner.textContent = versionLower.includes('staging') ? 'STAGING ENVIRONMENT' : 'UAT ENVIRONMENT';
          banner.style.cssText = `
            position: fixed; top: 0; left: 0; width: 100%;
            background: ${versionLower.includes('staging') ? '#f4e1f5' : '#f7e2a6'};
            color: white; font-weight: bold; text-align: left;
            padding: 8px; font-size: 1.2rem; z-index: -2000;
          `;
          document.body.appendChild(banner);
          document.body.style.paddingTop = '50px';
        }
      } catch (err) {
        console.error('Error setting app version:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      setAppVersionFromFile();
      const changelogLink = document.getElementById('changelogLink');
      const overlay = document.getElementById('changelogOverlay');
      const closeBtn = document.getElementById('changelogCloseBtn');
      const changelogContent = document.getElementById('changelogContent');

      changelogLink.addEventListener('click', async (e) => {
        e.preventDefault();
        changelogContent.textContent = 'Loading...';
        try {
          const res = await fetch('CHANGELOG.md');
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const mdText = await res.text();
          marked.setOptions({ breaks: true });
          changelogContent.innerHTML = marked.parse(mdText);
        } catch (err) {
          changelogContent.textContent = `Failed to load changelog: ${err.message}`;
          console.error(err);
        }
        overlay.style.display = 'flex';
      });

      closeBtn.addEventListener('click', () => { overlay.style.display = 'none'; });
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) overlay.style.display = 'none';
      });

      // ✅ In-app browser. Native gets the real thing; anywhere else (dev
      // server in Safari, Picker itself) falls back to a normal tab. Both
      // buttons land in the same browser — Picker as a tab, DB console as
      // another — so the home button stays pointed at Picker either way.
      function openInAppBrowser(url) {
        if (window.ScrayBridge && window.ScrayBridge.openBrowser) {
          window.ScrayBridge.openBrowser(url)
            .catch(err => console.error('[browser] openBrowser failed:', err));
        } else {
          window.open(url, '_blank');
        }
      }

      // Both the top-row "Picker" button and the corner "P" go through the
      // same listener - one source of truth for the URL. Changing it lives in
      // the Settings modal (footer), not on these buttons.
      ['openPickerBtn', 'pickerCornerBtn'].forEach(id => {
        document.getElementById(id)?.addEventListener('click', (e) => {
          e.preventDefault();
          openInAppBrowser(window.scrayPickerUrl());
        });
      });

      document.getElementById('openBrowseBtn')?.addEventListener('click', (e) => {
        e.preventDefault();
        openInAppBrowser((window.SCRAY_SYNC && window.SCRAY_SYNC.BROWSE_URL)
          || 'https://macnguyen.com/scray/browse.html');
      });
    });
  </script>
  <style>
    /* Note cloud - same pill shape as the bookmark modal's quick notes.
       ⚙️ Four rows of pills, then scroll. --bm-pill-h is one pill's height
       (6px padding top and bottom, 1px border, ~14px line box). Nudge it if
       the cloud clips a row or leaves a sliver of a fifth showing. */
    .bm-note-cloud {
      --bm-pill-h: 29px;
      --bm-pill-gap: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: var(--bm-pill-gap);
      margin: 8px 0 4px;
      max-height: calc(4 * var(--bm-pill-h) + 3 * var(--bm-pill-gap));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .bm-note-cloud-sort { display: flex; gap: 6px; margin-top: 10px; }
    .bm-note-search-row { display: flex; gap: 6px; margin-top: 6px; }
    #bmNoteSearch {
      flex: 1 1 auto; min-width: 0; margin: 0;
      padding: 6px 8px; font-size: 0.78rem;

    }

      flex: 0 0 auto; width: auto; margin: 0;
      padding: 6px 10px; font-size: 0.78rem; line-height: 1;
      border: 1px solid #ccc; border-radius: 4px;
      background: #f2f2f2; color: #666; cursor: pointer;
    }
    .bm-note-pill {
      flex: 0 0 auto; width: auto; margin: 0; padding: 6px 10px;
      font-size: 0.75rem; line-height: 1.2; border: 1px solid #ccc;
      border-radius: 4px; background: #f2f2f2; color: #333; cursor: pointer;
      white-space: nowrap;
    }
    .bm-note-pill.is-on { background: #6f42c1; border-color: #6f42c1; color: #fff; }
    .bm-note-pill .bm-note-count { opacity: 0.65; margin-left: 4px; }
    /* Row prefix: note then timestamp, ahead of the usual video details.
       No font-size here on purpose - the lock below owns it. */
    .bm-row-note { font-weight: bold; color: #6f42c1; margin-right: 6px; }
    .bm-row-note.is-empty { color: #999; font-weight: normal; font-style: italic; }
    .bm-row-time { font-family: monospace; color: #555; margin-right: 6px; }

    /* style.css locks the main list's font under `#playlist li,
       #taggedVideosContainer li`, by ID. #bmList matches neither, so rows here
       inherited the page default and only the spans that set their own size
       came out small. Same lock, same 0.75rem. Flat, not blue - the blue panel
       is #playlist's, and that stays the random list. */
    #bmList { list-style: none; padding: 0; margin: 0; }
    #bmList li {
      padding: 6px 6px;
      margin-bottom: 0;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
    }
    /* !important because buildVideoRow sets some sizes inline - the score
       badge is 0.65rem - and inline styles otherwise win. Scoped to a/span so
       the .compact-btn row keeps its own 0.65rem, exactly as on the main list. */
    #bmList li,
    #bmList li a,
    #bmList li span {
      font-size: 0.75rem !important;
      line-height: 1.4 !important;
    }
  </style>
</head>

<script>
(function(){
  const CORRECT_PASSWORD = "Michael1";
  const UNLOCK_CODE = "5555"; // ⚙️ on-screen keypad code (any length works)
  const inputEl = document.getElementById("lockPassword");
  const overlayEl = document.getElementById("lockOverlay");
  const errorEl = document.getElementById("lockError");
  const versionTapEl = document.getElementById("lockOverlayVersion");
  window.addEventListener('load', () => { inputEl.focus(); });

  function unlockApp() {
    overlayEl.style.display = "none";
    inputEl.blur(); // dismiss keyboard so it can't shift the layout further

    // Force the page open with the console (and account pills, which
    // sit just above it) at the top of the screen, instead of wherever
    // late-loading content (account pills, tag dropdown population,
    // docked-player spacer) leaves the scroll position. Keep
    // re-asserting for a few seconds since those async loads can keep
    // shifting #topSpacer's height after unlock.
    const scrollToConsole = () => {
      const consoleEl = document.getElementById("inlineConsole");
      if (consoleEl) {
        // Pull back up by roughly the console's own height (plus a
        // small extra nudge) so we don't scroll past it — leaves the
        // buttons/pills above it visible too.
        const SCROLL_EXTRA_NUDGE_PX = -40; // ⚙️ increase to scroll down more, decrease (or go negative) to scroll up more
        const y = consoleEl.getBoundingClientRect().top + window.pageYOffset - consoleEl.offsetHeight + SCROLL_EXTRA_NUDGE_PX;
        window.scrollTo(0, Math.max(0, y));
      } else {
        window.scrollTo(0, 0);
      }
    };
    // TESTING: the re-assert schedule below yanks the page back for up to 3s
    // after unlock, overriding any scroll made in that window. Keeping the
    // initial positioning, dropping the retries.
    scrollToConsole();
    requestAnimationFrame(scrollToConsole);
    // [50, 150, 300, 600, 1000, 2000, 3000].forEach(delay => {
    //   setTimeout(scrollToConsole, delay);
    // });
  }

  inputEl.addEventListener("input", function(){
    if(inputEl.value === CORRECT_PASSWORD){
      unlockApp();
    }
    else { errorEl.style.display = "none"; }
  });
  inputEl.addEventListener("keyup", function(){
    if(inputEl.value.length >= CORRECT_PASSWORD.length && inputEl.value !== CORRECT_PASSWORD){
      errorEl.style.display = "block";
    }
  });

  // Keypad unlock: enter UNLOCK_CODE on the on-screen digit pad. Dot count
  // follows UNLOCK_CODE.length, so changing the code needs no markup change.
  const keypadEl = document.getElementById("lockKeypad");
  const dotsEl = document.getElementById("lockPinDots");
  let pinEntry = "";

  function renderPinDots() {
    dotsEl.innerHTML = "";
    for (let i = 0; i < UNLOCK_CODE.length; i++) {
      const dot = document.createElement("span");
      if (i < pinEntry.length) dot.className = "filled";
      dotsEl.appendChild(dot);
    }
  }
  renderPinDots();

  function rejectPin() {
    pinEntry = "";
    renderPinDots();
    errorEl.style.display = "block";
    keypadEl.classList.remove("lock-shake");
    void keypadEl.offsetWidth; // force reflow so the animation restarts
    keypadEl.classList.add("lock-shake");
  }

  function pressPinKey(key) {
    if (key === "clear") { pinEntry = ""; errorEl.style.display = "none"; renderPinDots(); return; }
    if (key === "back") { pinEntry = pinEntry.slice(0, -1); errorEl.style.display = "none"; renderPinDots(); return; }
    if (!/^[0-9]$/.test(key)) return;
    errorEl.style.display = "none";
    // A full-but-wrong entry that wasn't cleared yet starts over on next digit.
    if (pinEntry.length >= UNLOCK_CODE.length) pinEntry = "";
    pinEntry += key;
    renderPinDots();
    if (pinEntry.length < UNLOCK_CODE.length) return;
    if (pinEntry === UNLOCK_CODE) {
      pinEntry = "";
      renderPinDots();
      unlockApp();
    } else {
      // Short delay so the last dot registers visually before the shake.
      setTimeout(rejectPin, 150);
    }
  }

  keypadEl.addEventListener("click", function(e){
    const btn = e.target.closest("button");
    if (!btn || !keypadEl.contains(btn)) return;
    pressPinKey(btn.dataset.key);
  });

  // DISABLED (was: secret backdoor - tap/click 3 times within 1.5s anywhere on the lock
  // screen (except the password input itself) to unlock
  let tapCount = 0;
  let tapResetTimer = null;
  overlayEl.style.cursor = "pointer";
  overlayEl.addEventListener("click", function(e){
    return; // ⛔ triple-tap unlock disabled - the keypad is the only tap route in
    tapCount++;
    clearTimeout(tapResetTimer);
    if (tapCount >= 3) {
      tapCount = 0;
      unlockApp();
      return;
    }
    tapResetTimer = setTimeout(() => { tapCount = 0; }, 1500);
  });
})();
</script>

<script>
document.addEventListener('DOMContentLoaded', () => {
const inlineConsole = document.getElementById('inlineConsole');
const copyBtn = document.getElementById('inlineConsoleCopyBtn');
if (!inlineConsole) return;

function formatArg(arg) {
  if (arg instanceof Error) return arg.stack || `${arg.name}: ${arg.message}`;
  if (typeof arg === 'object') {
    try { return JSON.stringify(arg, null, 2); } 
    catch (e) { return String(arg); }
  }
  return String(arg);
}

function appendToInlineConsole(args, type = 'log') {
  const entry = document.createElement('div');
  entry.className = `log-entry ${type}`;
  entry.textContent = args.map(formatArg).join(' ');
  inlineConsole.appendChild(entry);
  inlineConsole.scrollTop = inlineConsole.scrollHeight;
}

const origLog = console.log;
const origWarn = console.warn;
const origError = console.error;

console.log = (...args) => { origLog.apply(console, args); appendToInlineConsole(args, 'log'); };
console.warn = (...args) => { origWarn.apply(console, args); appendToInlineConsole(args, 'warn'); };
console.error = (...args) => { origError.apply(console, args); appendToInlineConsole(args, 'error'); };

copyBtn?.addEventListener('click', (e) => {
  const text = Array.from(inlineConsole.children).map(div => div.textContent).join('\n');
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.left = '-9999px';
  document.body.appendChild(textarea);
  textarea.focus();
  textarea.select();
  try {
    document.execCommand('copy');
    copyBtn.textContent = 'Copied!';
  } catch (err) {
    copyBtn.textContent = 'Failed';
  }
  document.body.removeChild(textarea);
  setTimeout(() => { copyBtn.textContent = 'copy'; }, 1500);
});
});
</script>
