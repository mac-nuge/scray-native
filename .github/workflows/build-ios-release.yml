permissions:
  contents: read

name: Build offline release IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Inject build fingerprint
        run: |
          mkdir -p modules/scray-native/ios
          echo "// Auto-generated at build time — do not edit or commit" > modules/scray-native/ios/BuildInfo.swift
          echo "enum BuildInfo { static let id = \"$(date -u +%Y%m%dT%H%M%SZ)-${{ github.sha }}\" }" >> modules/scray-native/ios/BuildInfo.swift
      - name: Generate web scray-key.js
        run: |
          if [ -z "${{ secrets.SCRAY_API_KEY }}" ]; then
            echo "::error::SCRAY_API_KEY repo secret is not set — the IPA would ship with no key"
            exit 1
          fi
          echo "// Auto-generated at build time — do not edit or commit" > assets/web/scray-key.js
          echo "window.SCRAY_API_KEY = \"${{ secrets.SCRAY_API_KEY }}\";" >> assets/web/scray-key.js
      - name: Generate web scray-key.js
        run: |
          if [ -z "${{ secrets.SCRAY_API_KEY }}" ]; then
            echo "::error::SCRAY_API_KEY repo secret is not set — the IPA would ship with no key"
            exit 1
          fi
          echo "// Auto-generated at build time — do not edit or commit" > assets/web/scray-key.js
          echo "window.SCRAY_API_KEY = \"${{ secrets.SCRAY_API_KEY }}\";" >> assets/web/scray-key.js
      - name: Generate web version.js
        run: |
          VERSION_TEXT="$(cat assets/web/VERSION 2>/dev/null | tr -d '\r\n')"
          if [ -z "$VERSION_TEXT" ]; then
            VERSION_TEXT="$(date -u +%Y%m%d)-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          echo "// Auto-generated at build time — do not edit or commit" > assets/web/version.js
          echo "window.SCRAY_VERSION = \"$VERSION_TEXT\";" >> assets/web/version.js
          cat assets/web/version.js
      - name: Compute artifact name
        id: ipa
        run: |
          WEB_VERSION="$(cat assets/web/VERSION 2>/dev/null | tr -d '\r\n')"
          echo "name=scray-native-prd-b${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "### pipa b${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "web assets: $WEB_VERSION" >> $GITHUB_STEP_SUMMARY
      - name: Prebuild iOS project (Release variant)
        run: npx expo prebuild --platform ios
        env:
          APP_VARIANT: production
          IPA_BUILD_NUMBER: ${{ github.run_number }}
      - name: Discover scheme name
        id: scheme
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace)
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Detected scheme: $SCHEME"
          echo "name=$SCHEME" >> $GITHUB_OUTPUT
      - name: Build unsigned .app (Release)
        run: |
          cd ios
          xcodebuild -workspace *.xcworkspace -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
      - name: Locate built .app
        run: find ios/build -name "*.app" -maxdepth 6
      - name: Package as .ipa
        run: |
          APP_PATH=$(find ios/build -name "*.app" -maxdepth 6 | head -n 1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r "${{ steps.ipa.outputs.name }}.ipa" Payload
      - name: Publish to the SideStore source
        # native 15.101: the IPA, its icon and the updated source.json go to a
        # folder on macnguyen.com behind an unguessable path (SIDESTORE_DIR /
        # SIDESTORE_URL). SideStore, given SIDESTORE_URL/source.json once,
        # then offers every build as an update. Skipped, with a warning, until
        # the secrets are set - the IPA is still attached to the run below.
        # See scripts/sidestore-publish.js.
        env:
          SS_SSH_KEY: ${{ secrets.SIDESTORE_SSH_KEY }}
          SS_HOST: ${{ secrets.SIDESTORE_HOST }}
          SS_PORT: ${{ secrets.SIDESTORE_PORT }}
          SS_USER: ${{ secrets.SIDESTORE_USER }}
          SS_DIR: ${{ secrets.SIDESTORE_DIR }}
          SS_BASE_URL: ${{ secrets.SIDESTORE_URL }}
          SS_BUNDLE_ID: com.mac.scraynative
          SS_APP_NAME: BBW iPlayer
          SS_ICON_SRC: assets/images/icon-release-iplayer.png
          SS_ICON_NAME: icon-prd.png
          SS_IPA_NAME: ${{ steps.ipa.outputs.name }}.ipa
          SS_BUILD: ${{ github.run_number }}
          SS_VERSION: 1.0.${{ github.run_number }}
        run: |
          if [ -z "$SS_SSH_KEY" ] || [ -z "$SS_HOST" ] || [ -z "$SS_USER" ] || [ -z "$SS_DIR" ] || [ -z "$SS_BASE_URL" ]; then
            echo "::warning::SideStore secrets aren't all set - not published (the IPA is still attached to this run)"
            exit 0
          fi
          SS_PORT="${SS_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SS_SSH_KEY" > ~/.ssh/sidestore && chmod 600 ~/.ssh/sidestore
          ssh-keyscan -p "$SS_PORT" "$SS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          OPTS="-i $HOME/.ssh/sidestore -o IdentitiesOnly=yes -o BatchMode=yes"
          remote() { ssh $OPTS -p "$SS_PORT" "$SS_USER@$SS_HOST" "$1"; }
          put() { scp $OPTS -P "$SS_PORT" "$1" "$SS_USER@$SS_HOST:$SS_DIR/$2"; }

          # No folder listing; source.json never cached, so a new build shows at once.
          printf '%s\n' 'Options -Indexes' \
            '<FilesMatch "\.json$">' '  Header set Cache-Control "no-cache, must-revalidate"' '</FilesMatch>' \
            '<FilesMatch "\.ipa$">' '  ForceType application/octet-stream' '</FilesMatch>' > ss.htaccess

          remote "mkdir -p '$SS_DIR'"
          put ss.htaccess .htaccess
          put "$SS_ICON_SRC" "$SS_ICON_NAME"
          # Uploaded under a temporary name, so a half-sent IPA is never listed.
          put "$SS_IPA_NAME" "$SS_IPA_NAME.part"
          remote "mv -f '$SS_DIR/$SS_IPA_NAME.part' '$SS_DIR/$SS_IPA_NAME'"

          remote "cat '$SS_DIR/source.json' 2>/dev/null || true" > ss-current.json
          export SS_IPA_SIZE="$(stat -f%z "$SS_IPA_NAME")"
          export SS_NOTES="$(tr -d '\r\n' < assets/web/VERSION 2>/dev/null) - IPA build $SS_BUILD"
          node scripts/sidestore-publish.js ss-current.json ss-source.json ss-keep.txt

          put ss-source.json source.json.part
          put ss-keep.txt .keep
          # Swap the source in, then delete IPAs it no longer lists (keeps the last 3 per app).
          remote "cd '$SS_DIR' && mv -f source.json.part source.json && for f in *.ipa; do grep -qxF \"\$f\" .keep || rm -f -- \"\$f\"; done"
          echo "Published build $SS_BUILD ($SS_VERSION) to the SideStore source." >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ipa.outputs.name }}
          path: ${{ steps.ipa.outputs.name }}.ipa