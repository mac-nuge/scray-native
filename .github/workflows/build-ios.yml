name: Build unsigned iOS IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx expo prebuild --platform ios
      - name: Discover scheme name
        id: scheme
        run: |
          cd ios
          SCHEME=$(xcodebuild -list -workspace *.xcworkspace -json | python3 -c "import json,sys; print(json.load(sys.stdin)['workspace']['schemes'][0])")
          echo "Detected scheme: $SCHEME"
          echo "name=$SCHEME" >> $GITHUB_OUTPUT
      - name: Build unsigned .app
        run: |
          cd ios
          xcodebuild -workspace *.xcworkspace -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration Debug -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
      - name: Locate built .app
        run: find ios/build -name "*.app" -maxdepth 6
      - name: Package as .ipa
        run: |
          APP_PATH=$(find ios/build -name "*.app" -maxdepth 6 | head -n 1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r scray-native.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: scray-native-ipa
          path: scray-native.ipa